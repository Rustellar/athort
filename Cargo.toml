[package]
name = "athort"
version = "0.1.0"
edition = "2024"
authors = ["Yasu"]
license = "Apache-2.0"
description = "Assortment of Parquet and other items"


[features]
default = []
common = []
csv = ["dep:csv", "common"]
json = ["dep:serde_json", "common"]
parquet = []

[dependencies]
# 共通で必要なら optional=false にしてOK
serde = { version = "1", features = ["derive"] }

# 機能別の依存は optional に
arrow   = { version = "56.2.0"}
parquet = { version = "56.2.0" }
csv     = { version = "1.3",    optional = true }
serde_json = { version = "1",   optional = true }